name: Upstream sync
on:
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose token
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set +e
          echo "--- who am I (REST rate_limit works for any token)"; gh api rate_limit --jq '.resources.core.limit' 2>&1 | head -2
          echo "--- read label via REST";    gh api "repos/$REPO/labels/meridian-sync-failed" --jq .name 2>&1 | head -2
          echo "--- list labels via REST (count)"; gh api "repos/$REPO/labels" --jq 'length' 2>&1 | head -2
          echo "--- label via GraphQL";      gh api graphql -f query='query($o:String!,$n:String!){repository(owner:$o,name:$n){labels(first:50){nodes{name}}}}' -f o="${REPO%/*}" -f n="${REPO#*/}" --jq '[.data.repository.labels.nodes[].name]|length' 2>&1 | head -3
          echo "--- list open PRs via REST"; gh api "repos/$REPO/pulls?state=open" --jq 'length' 2>&1 | head -2
          echo "--- create PR via REST (head branch that has no diff -> expect 422 'No commits', NOT 403)"
          gh api -X POST "repos/$REPO/pulls" -f title=diag -f head=diag/sync-token -f base=ours/antigravity-gateway-patch 2>&1 | head -4
          echo "--- create PR via GraphQL-based gh pr create"
          gh pr create --base ours/antigravity-gateway-patch --head diag/sync-token --title diag --body diag 2>&1 | head -4
          echo "--- workflow permission API";  gh api "repos/$REPO/actions/permissions/workflow" 2>&1 | head -3
