name: Upstream sync

# Hourly, free, no AI: a no-op run is one git command. When rynfar/meridian has new commits it merges
# them into the production branch, runs typecheck + Antigravity tests, merges via PR, and notifies Telegram.
# Conflicts or failed checks open an `meridian-sync-failed` issue for the Paseo Hub repair agent.
on:
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM: https://github.com/rynfar/meridian.git
  PROD: ours/antigravity-gateway-patch

jobs:
  sync:
    # `schedule` only fires from the default branch (main), so this file lives on main AND the production
    # branch; the job always checks out and updates the production branch.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.PROD }}
          fetch-depth: 0

      - name: Detect new upstream commits
        id: detect
        run: |
          git remote add upstream "$UPSTREAM"
          git fetch -q upstream main
          n=$(git rev-list --count "origin/$PROD..upstream/main")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "upstream commits not in $PROD: $n"
          if [ "$n" != 0 ]; then
            git log --format='%h %s' "origin/$PROD..upstream/main" | head -5 > "$RUNNER_TEMP/upstream-log.txt"
          fi

      - name: Notify start
        if: steps.detect.outputs.count != '0'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COUNT: ${{ steps.detect.outputs.count }}
        run: |
          text=$(printf '【Meridian 上游同步：开始】\n上游有 %s 个新提交，正在合并并测试\n%s' "$COUNT" "$(cut -c1-120 "$RUNNER_TEMP/upstream-log.txt")")
          curl -sS --max-time 20 -o /dev/null -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" --data-urlencode "text=${text}" --data-urlencode "disable_web_page_preview=true" || true

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.count != '0'
        with:
          node-version: "22"

      - uses: oven-sh/setup-bun@v2
        if: steps.detect.outputs.count != '0'

      - name: Merge upstream
        if: steps.detect.outputs.count != '0'
        id: merge
        run: |
          set -o pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="sync/upstream-$(date -u +%Y%m%d-%H%M)"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          git checkout -q -b "$branch"
          if git merge --no-ff --no-edit -m "sync: merge rynfar/meridian main" upstream/main; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflict=true" >> "$GITHUB_OUTPUT"
            git diff --name-only --diff-filter=U | tee "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
          fi

      - name: Typecheck and tests
        if: steps.detect.outputs.count != '0' && steps.merge.outputs.conflict == 'false'
        id: checks
        run: |
          set -o pipefail
          bun install --frozen-lockfile
          bun run typecheck
          MERIDIAN_RESILIENCE_STRICT=1 bun test src/__tests__/antigravity*.test.ts src/__tests__/replay*.test.ts src/__tests__/proxy-replay*.test.ts 2>&1 | tail -15 | tee "$RUNNER_TEMP/test-tail.txt"
          grep -q " 0 fail" "$RUNNER_TEMP/test-tail.txt"

      - name: Push, open PR and merge
        if: steps.detect.outputs.count != '0' && steps.merge.outputs.conflict == 'false' && steps.checks.outcome == 'success'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ steps.merge.outputs.branch }}
          COUNT: ${{ steps.detect.outputs.count }}
        run: |
          git push -q -u origin "$BRANCH"
          # REST, not `gh pr create`/`gh pr merge`: the workflow token is refused for GraphQL mutations on this repo
          # ("Resource not accessible by integration"), while the REST endpoints work.
          body="Automated upstream sync by GitHub Actions ($COUNT new upstream commits). Merge was conflict-free; typecheck and the Antigravity/replay suites (strict resilience group included) passed. Merged into the production branch only; nothing is deployed."
          number=$(gh api -X POST "repos/$GITHUB_REPOSITORY/pulls" -f title="sync: merge rynfar/meridian main ($COUNT commits)" -f head="$BRANCH" -f base="$PROD" -f body="$body" --jq .number)
          echo "url=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/pull/${number}" >> "$GITHUB_OUTPUT"
          merged=false
          for attempt in 1 2 3 4 5 6; do
            if gh api -X PUT "repos/$GITHUB_REPOSITORY/pulls/$number/merge" -f merge_method=merge --jq .merged > "$RUNNER_TEMP/merged.txt" 2> "$RUNNER_TEMP/merge-err.txt"; then merged=$(cat "$RUNNER_TEMP/merged.txt"); break; fi
            sleep 5   # GitHub computes mergeability asynchronously right after the PR is created
          done
          [ "$merged" = true ] || { cat "$RUNNER_TEMP/merge-err.txt"; echo "::error::PR #$number was created but could not be merged"; exit 1; }
          git push origin --delete "$BRANCH" || true

      - name: Notify result
        if: always() && steps.detect.outputs.count != '0'
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          COUNT: ${{ steps.detect.outputs.count }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
          CHECKS: ${{ steps.checks.outcome }}
          PR_URL: ${{ steps.pr.outputs.url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -n "$PR_URL" ]; then
            title="Meridian 上游同步：已合并"
            body=$(printf '%s 个上游提交已合入生产分支，类型检查与 Antigravity 测试通过。\nPR：%s\n已合入生产分支，尚未部署到 SG-west' "$COUNT" "$PR_URL")
          elif [ "$CONFLICT" = true ]; then
            title="Meridian 上游同步：需人工审"
            body=$(printf '合并有冲突，已开 issue 交给 Hub 修复 agent。\n冲突文件：%s\n运行：%s' "$(head -5 "$RUNNER_TEMP/conflicts.txt" | tr '\n' ' ')" "$RUN_URL")
          elif [ "$CHECKS" = "success" ]; then
            title="Meridian 上游同步：失败（检查已通过，合并步骤出错）"
            body=$(printf '测试和类型检查通过，但创建或合并 PR 失败，已开 issue 交给 Hub 修复 agent。\n运行：%s' "$RUN_URL")
          else
            title="Meridian 上游同步：失败"
            body=$(printf '检查未通过（%s），已开 issue 交给 Hub 修复 agent。\n运行：%s' "$CHECKS" "$RUN_URL")
          fi
          curl -sS --max-time 20 -o /dev/null -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT_ID}" --data-urlencode "text=【${title}】
          ${body}" --data-urlencode "disable_web_page_preview=true" || true

      - name: Open issue for Hub repair agent
        if: failure() && steps.detect.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFLICT: ${{ steps.merge.outputs.conflict }}
          CHECKS: ${{ steps.checks.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          reason="checks failed after a conflict-free merge"
          [ "${CHECKS:-}" = success ] && reason="checks passed but creating or merging the sync PR failed"
          [ "$CONFLICT" = true ] && reason="merge conflicts: $(head -10 "$RUNNER_TEMP/conflicts.txt" | tr '\n' ' ')"
          body="Upstream sync failed ($reason).

          Run: $RUN_URL
          Production branch: $PROD. Upstream: rynfar/meridian main. Do not deploy; repair via PR into $PROD."
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues?labels=meridian-sync-failed&state=open" --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$existing/comments" -f body="$body" --silent
          else
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f title="Upstream sync failed" -f body="$body" -f "labels[]=meridian-sync-failed" --silent
          fi
